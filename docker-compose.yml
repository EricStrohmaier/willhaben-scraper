services:
  scraping:
    build: .
    ports:
      - "3100:3100"
    environment:
      - PORT=3100
      - API_KEY=${API_KEY:-}
      - MAX_CONCURRENT=3
      - SCRAPING_BROWSER_WS=${SCRAPING_BROWSER_WS:-}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3100/health"]
      interval: 30s
      timeout: 5s
      retries: 3
